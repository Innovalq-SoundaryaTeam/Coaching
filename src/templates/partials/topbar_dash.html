<header class="dash-topbar">
  <button class="btn btn-sm btn-outline-secondary border-ap d-lg-none" data-sidebar-toggle type="button" aria-label="Toggle sidebar">
    <i class="bi bi-list fs-5"></i>
  </button>

  <div class="dash-search d-none d-md-flex">
    <i class="bi bi-search text-muted"></i>
    <input type="search" placeholder="{{ search_placeholder or 'Search…' }}">
  </div>

  <h1 class="h5 mb-0 d-md-none fw-bold">{{ page_title }}</h1>

  <div class="ms-auto d-flex align-items-center gap-2">
    <button class="theme-toggle-btn" data-theme-toggle type="button" title="Toggle dark / light mode">
      <i class="bi bi-moon-stars" data-theme-icon></i>
    </button>
    <button class="rtl-toggle-btn d-none d-sm-inline-flex" data-dir-toggle type="button" title="Toggle RTL / LTR">
      <i class="bi bi-translate"></i>
    </button>
    <div class="dropdown">
      <button class="btn btn-sm btn-outline-secondary border-ap position-relative rounded-circle p-2" data-bs-toggle="dropdown" aria-label="Notifications">
        <i class="bi bi-bell"></i>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:.6rem;">5</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end p-2" style="width:20rem;">
        <li><h6 class="dropdown-header">Notifications</h6></li>
        {% for n in notifications %}
        <li><a class="dropdown-item rounded-3 py-2" href="#">
          <div class="d-flex gap-2">
            <span class="icon-tile flex-shrink-0" style="width:2.2rem;height:2.2rem;font-size:1rem;"><i class="bi {{ n.icon }}"></i></span>
            <span>
              <span class="d-block small fw-semibold">{{ n.title }}</span>
              <span class="d-block small text-muted">{{ n.time }}</span>
            </span>
          </div>
        </a></li>
        {% endfor %}
      </ul>
    </div>
    <div class="dropdown">
      <button class="btn btn-sm d-flex align-items-center gap-2 border-ap" data-bs-toggle="dropdown">
        <img src="{{ rel }}{{ user.avatar }}" class="avatar-sm" alt="{{ user.name }}">
        <span class="d-none d-lg-inline fw-semibold">{{ user.name }}</span>
        <i class="bi bi-chevron-down small d-none d-lg-inline"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="{{ rel }}login.html"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
      </ul>
    </div>
  </div>
</header>
